[build]
  command = "npm run remote:build && npm run docs:build"
  publish = "docs/.vitepress/dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_CONTENT_MODE = "remote"

[dev]
  command = "npm run docs:dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# VitePress prerenders each route. Netlify Pretty URLs serves the matching
# HTML file; do not rewrite missing articles or private routes to the homepage.
