<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>写作空间 · ok俎</title></head>
<body>
  <div id="app">
    <header class="topbar"><a href="/" class="brand"><img src="/images/okzu-avatar.webp" alt=""><span>ok俎 / 写作空间</span></a><span class="private-mark">仅作者可用</span><button id="logout" type="button" hidden>退出登录</button></header>
    <main>
      <section id="login-view" class="login-card"><span class="eyebrow">PRIVATE WORKSPACE</span><h1>回来写点东西。</h1><p>笔记先保存为私有草稿，准备好再公开发布。</p><form id="login-form"><label>邮箱<input id="email" type="email" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">登录写作空间</button></form><button id="forgot-password" type="button">忘记密码？发送重置邮件</button><p id="login-message" role="status"></p></section>
      <section id="account-view" class="login-card" hidden><span class="eyebrow">ACCOUNT SETUP</span><h1 id="account-title">设置登录密码</h1><p id="account-description">请设置一个仅用于写作后台的密码。</p><form id="account-form"><label>新密码<input id="new-password" type="password" autocomplete="new-password" minlength="8" required></label><label>确认新密码<input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required></label><button class="primary" type="submit">完成设置</button></form><p id="account-message" role="status"></p></section>
      <section id="workspace" hidden><div class="workspace-heading"><div><span class="eyebrow">MY NOTES</span><h1>写作空间</h1><p>整理问题、记录实践，然后决定何时公开。</p></div><div class="heading-actions"><button id="backup" type="button">导出全部备份</button><a href="/" target="_blank" rel="noopener">查看博客 ↗</a></div></div>
        <div id="list-view"><div class="list-tools"><button id="new-note" class="primary" type="button">＋ 新建笔记</button><label class="import-button">导入 Markdown / ZIP<input id="import-file" type="file" accept=".md,.markdown,.zip,text/markdown,application/zip" hidden></label><label class="filter">栏目 <select id="category-filter"><option value="">全部栏目</option></select></label><label class="filter">状态 <select id="status-filter"><option value="">全部状态</option><option value="draft">草稿</option><option value="changed">未发布修改</option><option value="published">已发布</option></select></label></div><div id="notes-list" class="notes-list" aria-live="polite"></div></div>
        <div id="editor-view" hidden><div class="editor-head"><button id="back-list" type="button">← 返回列表</button><span id="save-state" role="status">未保存</span><button id="save-note" type="button">保存草稿</button><button id="publish-note" type="button" class="primary">发布文章</button></div>
          <form id="note-form"><div class="sheet"><textarea name="title" id="note-title" rows="2" placeholder="给笔记起个标题…" maxlength="200"></textarea><div class="note-meta"><label>栏目 <select name="key" id="category"></select></label><label>文章网址 <input name="slug" id="slug" maxlength="101" placeholder="如 redis-cache-notes"></label><label>日期 <input name="date" type="date"></label></div><div class="body-tabs"><button id="rich-tab" type="button" class="active">笔记编辑</button><button id="source-tab" type="button">Markdown</button><button id="preview-tab" type="button">阅读预览</button><button id="insert-image" type="button">插入图片</button><input id="image-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/avif" hidden></div><div id="rich-toolbar" class="rich-toolbar"><button type="button" data-command="bold">粗体</button><button type="button" data-command="italic">斜体</button><button type="button" data-command="heading" data-value="2">标题</button><button type="button" data-command="bullet">列表</button><button type="button" data-command="code">代码块</button><button type="button" data-command="table">表格</button></div><div id="rich-editor"></div><textarea name="body" id="source-editor" rows="22" spellcheck="false" hidden></textarea><div id="preview" class="preview" hidden></div><details class="more-settings"><summary>摘要、标签与阅读时间</summary><label>摘要 <textarea name="description" rows="3" maxlength="2000" placeholder="一句话介绍这篇文章"></textarea></label><div class="more-row"><label>标签 <input name="tags" placeholder="用逗号分隔"></label><label>阅读时间 <input name="readingTime" maxlength="80" value="约 8 分钟"></label></div></details><div class="sheet-foot"><span id="word-count">0 字</span><span>自动保存草稿 · 只有点击发布才会公开</span></div></div></form></div>
      </section>
      <p id="notice" class="notice" role="status" hidden></p>
    </main>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
